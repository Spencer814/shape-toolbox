name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # Dependabot runs get no Actions secrets, so the review could only fail there.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # A CI run ends when Claude's turn ends; background subagents would be cut off before they report.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets Claude's own fix pull requests get reviewed.
          allowed_bots: claude
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
      - name: Summarize the Claude run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # Prints only Claude's final message and any refused tool calls; full output stays off on a public repo.
        run: |
          jq -r '.[] | select(.type == "result") | "Result: \(.result // "")", (.permission_denials[]? | "Denied: \(.tool_name) \(.tool_input | tojson)")' "$EXECUTION_FILE"
